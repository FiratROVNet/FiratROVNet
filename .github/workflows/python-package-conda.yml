name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
      - "feature/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint and tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash -l {0}
    env:
      PYTHONUNBUFFERED: "1"
      DISPLAY: ":0"
      LIBGL_ALWAYS_SOFTWARE: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: firat-rovnet-env
          environment-file: environment.yml
          auto-activate-base: false
          auto-update-conda: true

      - name: Show environment
        run: |
          python --version
          python -m pip --version
          conda info --envs

      - name: Install CI tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest

      - name: Lint fatal errors
        run: |
          flake8 . \
            --count \
            --select=E9,F63,F7,F82 \
            --show-source \
            --statistics \
            --exclude=.git,__pycache__,.pytest_cache,.mypy_cache,.venv,venv,build,dist

      - name: Lint style warnings
        continue-on-error: true
        run: |
          flake8 . \
            --count \
            --max-complexity=10 \
            --max-line-length=127 \
            --statistics \
            --exclude=.git,__pycache__,.pytest_cache,.mypy_cache,.venv,venv,build,dist

      - name: Run headless test suite
        run: python run_tests.py
